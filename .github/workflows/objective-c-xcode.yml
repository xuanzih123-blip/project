name: Build Tweak

on:
  push:
    branches: [ "main", "master" ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4

    - name: Cache Theos
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/../theos
        key: theos-${{ runner.os }}-${{ hashFiles('.github/workflows/objective-c-xcode.yml') }}
        restore-keys: |
          theos-${{ runner.os }}-

    - name: Install Theos
      run: |
        if [ ! -d "$HOME/theos/.git" ]; then
          git clone --depth 1 --recursive https://github.com/theos/theos.git $HOME/theos
        fi
        echo "THEOS=$HOME/theos" >> $GITHUB_ENV
        echo "$HOME/theos/bin" >> $GITHUB_PATH
        brew install ldid
        $THEOS/bin/nic.pl

    - name: Build Tweak
      run: |
        make clean
        make package
        ls -la packages/

    - name: Upload deb artifact
      uses: actions/upload-artifact@v4
      with:
        name: mona
        path: ./packages/*.deb
