name: Build Tweak

on:
  push:
    branches: [ "main", "master" ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4

    - name: Cache Theos
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/../theos
        key: theos-${{ runner.os }}-${{ hashFiles('.github/workflows/objective-c-xcode.yml') }}
        restore-keys: |
          theos-${{ runner.os }}-

    - name: Install Theos
      run: |
        THEOS_DIR="${{ github.workspace }}/../theos"
        if [ ! -d "$THEOS_DIR/.git" ]; then
          git clone --depth 1 --recursive https://github.com/theos/theos.git "$THEOS_DIR"
        fi
        echo "THEOS=$THEOS_DIR" >> $GITHUB_ENV
        echo "$THEOS_DIR/bin" >> $GITHUB_PATH
        brew list ldid >/dev/null 2>&1 || brew install ldid

    - name: Build Tweak
      run: |
        make clean
        make package
        ls -la packages/

    - name: Stage the dylib bundle
      run: |
        set -x
        # Theos builds the dylib here. The deb is only a wrapper around it.
        find .theos/obj -name "mona.dylib"
        mkdir -p build/install
        cp "$(find .theos/obj -name 'mona.dylib' | head -1)" build/install/mona.dylib
        # The filter plist has to sit next to the dylib under the same name,
        # otherwise the loader does not know which app to inject into.
        cp mona.plist build/install/mona.plist
        ls -l build/install

    - name: Sign and inspect the dylib
      continue-on-error: true
      run: |
        set -x
        # ldid takes the entitlements glued to the -S flag.
        # A bare -S signs ad hoc, which is enough for a jailbroken device.
        ldid -S build/install/mona.dylib || true
        ldid -e build/install/mona.dylib || true
        lipo -info build/install/mona.dylib
        file build/install/mona.dylib
        otool -l build/install/mona.dylib | grep -A3 LC_CODE_SIGNATURE || true

    - name: Smoke test the dylib
      run: |
        set -x
        ls -l build/install/mona.dylib
        plutil -p build/install/mona.plist
        # the filter has to name the game bundle
        plutil -extract Filter.Bundles.0 raw build/install/mona.plist
        # our own symbols have to be in there
        strings build/install/mona.dylib | grep -m5 -E "Msa7|ESPRenderer|FOVCircleManager|AimbotVisible" || true
        nm -gU build/install/mona.dylib | head -10 || true
        test -s build/install/mona.dylib
        test -s build/install/mona.plist
        echo "SMOKE OK"

    - name: Upload the deb artifact
      uses: actions/upload-artifact@v4
      with:
        name: mona
        path: ./packages/*.deb

    - name: Upload the dylib bundle
      uses: actions/upload-artifact@v4
      with:
        name: mona-dylib
        path: build/install
        if-no-files-found: error
